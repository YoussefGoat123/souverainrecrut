# ==========================================
# Analyse SonarQube – SouverainRecrut Backend
# ==========================================
# Le token et l'URL du serveur ne sont PAS écrits ici :
# ils sont passés en ligne de commande (-Dsonar.token / -Dsonar.host.url)
# ou fournis par Jenkins (withSonarQubeEnv).

sonar.projectKey=souverainrecrut-backend
sonar.projectName=SouverainRecrut Backend
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8

# Code applicatif et tests
sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.ts

# Couverture produite par "npm run test:coverage" (Jest, reporter lcov)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Mêmes exclusions de couverture que jest.config.js :
# démarrage du serveur et documentation Swagger, sans logique métier
sonar.coverage.exclusions=src/server.ts,src/docs/**,src/swagger/**

# Les fichiers de documentation OpenAPI sont très répétitifs par nature
sonar.cpd.exclusions=src/docs/**

---
# ==========================================================
# Préparation du serveur de déploiement SouverainRecrut
# ==========================================================
# Usage (depuis deploiement/ansible) :
#   ansible-playbook -i inventory.ini playbook.yml --ask-become-pass
#
# Idempotent : peut être relancé sans effet de bord (états "ok" au 2e passage).
- name: Préparer le serveur Ubuntu pour le déploiement Docker
  hosts: app_servers
  become: true

  vars:
    docker_packages:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin

  tasks:
    # ---------- 1. Système ----------
    - name: Mettre à jour le cache APT et le système
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
        upgrade: safe

    - name: Installer les dépendances
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - ufw
        state: present

    # ---------- 2. Docker Engine + Compose (dépôt officiel Docker) ----------
    - name: Créer le répertoire des clés APT
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Télécharger la clé GPG officielle de Docker
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Ajouter le dépôt APT de Docker
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/ubuntu {{ ansible_facts['distribution_release'] }} stable
        filename: docker
        state: present

    - name: Installer Docker Engine et le plugin Docker Compose
      ansible.builtin.apt:
        name: "{{ docker_packages }}"
        state: present
        update_cache: true

    - name: Activer et démarrer le service Docker
      ansible.builtin.systemd_service:
        name: docker
        enabled: true
        state: started

    - name: Autoriser l'utilisateur de déploiement à utiliser Docker (sans sudo)
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: docker
        append: true

    # ---------- 3. Répertoire de déploiement ----------
    - name: Créer le répertoire de déploiement
      ansible.builtin.file:
        path: "{{ deploy_dir }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0750"

    # ---------- 4. Pare-feu (SSH d'abord pour ne jamais se couper l'accès) ----------
    - name: Autoriser SSH (22/tcp) et l'API ({{ api_port }}/tcp) dans UFW
      ansible.builtin.command: "ufw allow {{ item }}"
      loop:
        - "22/tcp"
        - "{{ api_port }}/tcp"
      register: ufw_rules
      changed_when: "'Skipping' not in ufw_rules.stdout"

    - name: Lire l'état du pare-feu
      ansible.builtin.command: ufw status
      register: ufw_status_before
      changed_when: false

    - name: Activer le pare-feu UFW
      ansible.builtin.command: ufw --force enable
      when: "'Status: active' not in ufw_status_before.stdout"

    # ---------- 5. Vérifications ----------
    - name: Vérifier la version de Docker
      ansible.builtin.command: docker version --format '{{ "{{" }}.Server.Version{{ "}}" }}'
      register: docker_version
      changed_when: false

    - name: Vérifier la version de Docker Compose
      ansible.builtin.command: docker compose version --short
      register: compose_version
      changed_when: false

    - name: Vérifier l'état du service Docker
      ansible.builtin.command: systemctl is-active docker
      register: docker_active
      changed_when: false

    - name: Vérifier le pare-feu
      ansible.builtin.command: ufw status
      register: ufw_status
      changed_when: false

    - name: Résumé
      ansible.builtin.debug:
        msg:
          - "Docker Engine : {{ docker_version.stdout }} ({{ docker_active.stdout }})"
          - "Docker Compose : {{ compose_version.stdout }}"
          - "Répertoire de déploiement : {{ deploy_dir }}"
          - "{{ ufw_status.stdout_lines }}"
